[project]
name = "multiagent"
version = "0.1.0"
description = "LangGraph-based biomedical Literature-Based Discovery multi-agent prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "openai>=1.0",
  "einops>=0.8",
  "einx>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
multiagent = "multiagent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
